name: Build & Release

on:
  # Manual run: always builds, whatever the state of the Releases page.
  # Runs on a non-default branch build and upload an artifact but never publish.
  workflow_dispatch:
    inputs:
      ghidra_version:
        description: "Ghidra version to build against (blank = latest release)"
        required: false
        default: ""
      plugin_version:
        description: "Override the date-derived version (e.g. 2026.08.13)"
        required: false
        default: ""
  # Weekly poll: builds ONLY when a Ghidra version we have never built appears.
  # Pushes trigger nothing at all.
  schedule:
    - cron: "23 4 * * 1"

# Read-only by default. Only the publish job gets write access (see below),
# so nothing that runs third-party code (Ghidra, Gradle) ever holds a token
# that can change the repository or its releases.
permissions:
  contents: read

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ====================================================================
  # Pre-flight. No checkout of Ghidra, no build: a few seconds when idle.
  # Works out the version from the code date and whether there is anything
  # new to do.
  # ====================================================================
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      skip:           ${{ steps.decide.outputs.skip }}
      version:        ${{ steps.decide.outputs.version }}
      ghidra_url:     ${{ steps.ghidra.outputs.url }}
      ghidra_asset:   ${{ steps.ghidra.outputs.asset }}
      ghidra_version: ${{ steps.ghidra.outputs.version }}
      ghidra_sha256:  ${{ steps.ghidra.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Resolve Ghidra release
        id: ghidra
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED: ${{ inputs.ghidra_version }}
        run: |
          set -euo pipefail
          if [ -n "${REQUESTED:-}" ]; then
            if ! [[ "$REQUESTED" =~ ^[0-9]+(\.[0-9]+){1,3}$ ]]; then
              echo "::error::ghidra_version must look like 11.4 or 11.4.2, got '$REQUESTED'"
              exit 1
            fi
            JSON=$(gh api "repos/NationalSecurityAgency/ghidra/releases/tags/Ghidra_${REQUESTED}_build")
          else
            JSON=$(gh api repos/NationalSecurityAgency/ghidra/releases/latest)
          fi

          URL=$(jq -r '.assets[]
                       | select(.name | test("^ghidra_.*_PUBLIC_[0-9]{8}\\.zip$"))
                       | .browser_download_url' <<<"$JSON" | head -n1)
          [ -n "$URL" ] || { echo "::error::No ghidra_*_PUBLIC_*.zip asset found"; exit 1; }
          case "$URL" in
            https://github.com/NationalSecurityAgency/ghidra/releases/download/*) ;;
            *) echo "::error::Unexpected download URL: $URL"; exit 1 ;;
          esac

          ASSET=$(basename "$URL")

          # ---- Expected SHA-256 of the zip ------------------------------
          # Two sources: the asset digest GitHub computes on upload (newer
          # releases only) and the "SHA-256: ..." line Ghidra puts in its
          # release notes. Use whichever exists; if both exist they must agree.
          SHA_DIGEST=$(jq -r --arg n "$ASSET" \
                         '.assets[] | select(.name == $n) | .digest // empty' <<<"$JSON")
          SHA_DIGEST=${SHA_DIGEST#sha256:}
          SHA_NOTES=$(jq -r '.body // ""' <<<"$JSON" | tr '\r\n' '  ' \
                        | grep -ioE 'SHA-?256[^0-9a-fA-F]{0,20}[0-9a-fA-F]{64}' \
                        | grep -oE '[0-9a-fA-F]{64}$' | head -n1 | tr 'A-F' 'a-f' || true)

          if [ -n "$SHA_DIGEST" ] && [ -n "$SHA_NOTES" ] && [ "$SHA_DIGEST" != "$SHA_NOTES" ]; then
            echo "::error::SHA-256 in release notes ($SHA_NOTES) differs from asset digest ($SHA_DIGEST)"
            exit 1
          fi
          SHA256=${SHA_DIGEST:-$SHA_NOTES}
          if ! [[ "$SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::No SHA-256 published for $ASSET, refusing to build against an unverified download"
            exit 1
          fi

          {
            echo "url=$URL"
            echo "asset=$ASSET"
            echo "sha256=$SHA256"
            echo "version=$(sed -E 's/^ghidra_([^_]+)_PUBLIC_.*/\1/' <<<"$ASSET")"
          } >> "$GITHUB_OUTPUT"

      - name: Version from code date, and decide whether to build
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          GHIDRA_VERSION: ${{ steps.ghidra.outputs.version }}
          OVERRIDE: ${{ inputs.plugin_version }}
          EXT_NAME: frida_hook_generator
        run: |
          set -euo pipefail
          # The override becomes a git tag and part of a file name, so keep it tame.
          if [ -n "${OVERRIDE:-}" ] && ! [[ "$OVERRIDE" =~ ^[0-9]{4}\.[0-9]{2}\.[0-9]{2}(\.[0-9]+)?$ ]]; then
            echo "::error::plugin_version must look like 2026.08.13 or 2026.08.13.2, got '$OVERRIDE'"
            exit 1
          fi

          # Date of the commit being built - not the date the workflow ran.
          CODE_DATE=$(TZ=UTC git log -1 --format=%cd --date=format-local:%Y.%m.%d)
          gh api "repos/$GITHUB_REPOSITORY/releases" --paginate > /tmp/releases.json

          CODE_DATE="$CODE_DATE" python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, re, subprocess

          repo  = os.environ["GITHUB_REPOSITORY"]
          sha   = os.environ["GITHUB_SHA"]
          event = os.environ["GITHUB_EVENT_NAME"]
          date  = os.environ["CODE_DATE"]
          gver  = os.environ["GHIDRA_VERSION"]
          ext   = os.environ["EXT_NAME"]
          override = os.environ.get("OVERRIDE", "").strip()

          rels = json.load(open("/tmp/releases.json"))

          # ---- Has this Ghidra version ever been built? -------------------
          built = any(
              re.match(rf"^ghidra_{re.escape(gver)}_PUBLIC_", a["name"])
              for r in rels for a in r.get("assets", [])
          )

          # ---- Which commit does an existing release point at? ------------
          def commit_of(rel):
              tc = rel.get("target_commitish", "")
              if re.fullmatch(r"[0-9a-f]{40}", tc):
                  return tc
              # The commits endpoint resolves a tag to its commit, also for
              # annotated tags (git/ref/tags would return the tag object's SHA).
              p = subprocess.run(
                  ["gh", "api", f"repos/{repo}/commits/{rel['tag_name']}",
                   "-q", ".sha"],
                  capture_output=True, text=True)
              return p.stdout.strip() if p.returncode == 0 else ""

          # ---- Allocate the version, disambiguating same-day builds -------
          # First release of a day is vYYYY.MM.DD, later ones .2, .3, ...
          pat = re.compile(rf"^v{re.escape(date)}(?:\.(\d+))?$")
          same_day = {}
          for r in rels:
              m = pat.match(r["tag_name"])
              if m:
                  same_day[int(m.group(1) or 1)] = r

          def label(rev):
              return date if rev == 1 else f"{date}.{rev}"

          version = None
          for rev, r in sorted(same_day.items()):
              if commit_of(r) == sha:
                  # Same commit as an existing release: reuse that version so a
                  # rebuild against a newer Ghidra does not invent a new one.
                  version = label(rev)
                  break
          if version is None:
              version = label(max(same_day) + 1 if same_day else 1)
          if override:
              version = override

          # ---- Build or not? ---------------------------------------------
          # Manual runs always build. The weekly poll builds only for a Ghidra
          # version that has never been built before.
          skip = (event == "schedule" and built)

          print(f"version={version}")
          print(f"skip={'true' if skip else 'false'}")

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as fh:
              fh.write(f"| | |\n|---|---|\n")
              fh.write(f"| Code date | `{date}` |\n")
              fh.write(f"| Version | `{version}` |\n")
              fh.write(f"| Ghidra | `{gver}` |\n")
              fh.write(f"| Ghidra built before | {'yes' if built else 'no'} |\n")
              if skip:
                  fh.write(f"\nGhidra {gver} has already been built and this is "
                           f"the weekly poll - nothing to do. Use **Run "
                           f"workflow** to force a build of {ext}.\n")
          PY

  # ====================================================================
  # Build. Runs Ghidra and Gradle (third-party code), so it only ever has
  # a read-only token and hands its result to the publish job as an artifact.
  # ====================================================================
  build:
    needs: check
    if: needs.check.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      asset_name: ${{ steps.artifact.outputs.name }}
      gradle:     ${{ steps.toolchain.outputs.gradle }}
      java:       ${{ steps.toolchain.outputs.java }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false   # keep the token out of .git/config, away from the build

      - name: Cache Ghidra install
        id: ghidra-cache
        uses: actions/cache@v4
        with:
          path: ~/ghidra
          key: ghidra-${{ needs.check.outputs.ghidra_asset }}-${{ needs.check.outputs.ghidra_sha256 }}

      - name: Download, verify & extract Ghidra
        if: steps.ghidra-cache.outputs.cache-hit != 'true'
        env:
          GHIDRA_URL: ${{ needs.check.outputs.ghidra_url }}
          GHIDRA_SHA256: ${{ needs.check.outputs.ghidra_sha256 }}
        run: |
          set -euo pipefail
          mkdir -p ~/ghidra
          curl -fL --retry 5 --retry-delay 5 --retry-all-errors --connect-timeout 20 \
               -o /tmp/ghidra.zip "$GHIDRA_URL"
          echo "$GHIDRA_SHA256  /tmp/ghidra.zip" | sha256sum -c -
          unzip -q /tmp/ghidra.zip -d ~/ghidra
          rm -f /tmp/ghidra.zip

      # ------------------------------------------------------------------
      # Read the toolchain THIS Ghidra demands, instead of hardcoding it
      # ------------------------------------------------------------------
      - name: Resolve required Gradle & JDK
        id: toolchain
        run: |
          set -euo pipefail
          INSTALL_DIR=$(echo "$HOME"/ghidra/ghidra_*_PUBLIC)
          [ -d "$INSTALL_DIR" ] || { echo "::error::Ghidra install dir not found"; exit 1; }
          echo "GHIDRA_INSTALL_DIR=$INSTALL_DIR" >> "$GITHUB_ENV"

          PROPS="$INSTALL_DIR/Ghidra/application.properties"
          echo "--- $PROPS ---"; cat "$PROPS"

          prop() { grep -E "^$1=" "$PROPS" | head -n1 | cut -d= -f2- | tr -d '\r' | xargs; }

          JAVA_MIN=$(prop application.java.min)
          GRADLE_MIN=$(prop application.gradle.min)
          GRADLE_MAX=$(prop application.gradle.max)
          # Pre-11.x releases used a single application.gradle.version key
          if [ -z "$GRADLE_MIN" ]; then GRADLE_MIN=$(prop application.gradle.version); fi
          [ -n "$JAVA_MIN" ]   || { echo "::error::application.java.min missing";   exit 1; }
          [ -n "$GRADLE_MIN" ] || { echo "::error::application.gradle.min missing"; exit 1; }

          # Ghidra states a minimum like "9.1" but the published distribution is
          # "9.1.0", so reconcile against the real version list.
          GRADLE=$(GRADLE_MIN="$GRADLE_MIN" GRADLE_MAX="$GRADLE_MAX" python3 - <<'PY'
          import json, os, urllib.request

          def key(v):
              return tuple(int(p) for p in v.split("."))

          lo = key(os.environ["GRADLE_MIN"])
          hi = os.environ["GRADLE_MAX"].strip()
          hi = key(hi) if hi else None

          data = json.load(urllib.request.urlopen(
              "https://services.gradle.org/versions/all", timeout=60))

          ok = []
          for r in data:
              if r.get("snapshot") or r.get("nightly") or r.get("releaseNightly") \
                 or r.get("broken") or r.get("rcFor"):
                  continue
              try:
                  k = key(r["version"])
              except ValueError:
                  continue          # milestones, rc tags, etc.
              if k >= lo and (hi is None or k < hi):
                  ok.append((k, r["version"]))

          print(min(ok)[1] if ok else os.environ["GRADLE_MIN"])
          PY
          )

          echo "java=$JAVA_MIN" >> "$GITHUB_OUTPUT"
          echo "gradle=$GRADLE" >> "$GITHUB_OUTPUT"
          echo "Toolchain: JDK $JAVA_MIN, Gradle $GRADLE (min $GRADLE_MIN, max ${GRADLE_MAX:-none})" \
            >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ steps.toolchain.outputs.java }}

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ steps.toolchain.outputs.gradle }}

      # ------------------------------------------------------------------
      # First-run initialization, headless (no X server on the runner)
      # ------------------------------------------------------------------
      - name: Initialize Ghidra
        run: |
          set -euo pipefail
          chmod -R +x "$GHIDRA_INSTALL_DIR/support" "$GHIDRA_INSTALL_DIR/os" 2>/dev/null || true
          mkdir -p /tmp/ghidra-init
          "$GHIDRA_INSTALL_DIR/support/analyzeHeadless" \
            /tmp/ghidra-init InitProject \
            -import /bin/true \
            -noanalysis \
            -deleteProject

      # ------------------------------------------------------------------
      # Build
      # ------------------------------------------------------------------
      - name: Build extension
        run: |
          set -euo pipefail
          rm -rf dist && mkdir -p dist      # drop the committed zips so the glob is unambiguous
          gradle buildExtension -PGHIDRA_INSTALL_DIR="$GHIDRA_INSTALL_DIR" --no-daemon --stacktrace
          ls -lh dist

      - name: Name the artifact
        id: artifact
        env:
          VERSION: ${{ needs.check.outputs.version }}
          EXT_NAME: frida_hook_generator
        run: |
          set -euo pipefail
          # Gradle names the zip after the checkout directory, which is the
          # repository name (taken from the env so forks and renames still work).
          REPO_DIR_NAME="${GITHUB_REPOSITORY#*/}"
          shopt -s nullglob
          ZIPS=(dist/*.zip)
          [ "${#ZIPS[@]}" -eq 1 ] || { echo "::error::Expected exactly one zip in dist/, found ${#ZIPS[@]}"; exit 1; }
          BUILT="${ZIPS[0]}"
          # Restore the project's dist/ naming and append the date-derived version.
          BASE=$(basename "${BUILT%.zip}")
          BASE="${BASE%_"$REPO_DIR_NAME"}"
          FINAL="dist/${BASE}_${EXT_NAME}_${VERSION}.zip"
          mv "$BUILT" "$FINAL"
          echo "path=$FINAL" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$FINAL")" >> "$GITHUB_OUTPUT"
          echo "Artifact: \`$(basename "$FINAL")\`" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: frida_hook_generator-${{ needs.check.outputs.version }}-ghidra-${{ needs.check.outputs.ghidra_version }}
          path: ${{ steps.artifact.outputs.path }}
          if-no-files-found: error

  # ====================================================================
  # Publish: one release per code date, holding a zip per Ghidra version.
  # The only job with write access. It runs no third-party code: it takes
  # the zip the build produced and hands it to `gh release`.
  # Only from the default branch (scheduled runs always use it; manual runs
  # on other branches stop after the build and keep the artifact).
  # ====================================================================
  publish:
    needs: [check, build]
    if: >-
      github.event_name == 'schedule' ||
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: frida_hook_generator-${{ needs.check.outputs.version }}-ghidra-${{ needs.check.outputs.ghidra_version }}
          path: dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}   # no checkout in this job, so tell gh which repo
          ASSET: dist/${{ needs.build.outputs.asset_name }}
          VERSION: ${{ needs.check.outputs.version }}
          GHIDRA_VERSION: ${{ needs.check.outputs.ghidra_version }}
          GRADLE_VERSION: ${{ needs.build.outputs.gradle }}
          JAVA_VERSION: ${{ needs.build.outputs.java }}
        run: |
          set -euo pipefail
          [ -f "$ASSET" ] || { echo "::error::Artifact $ASSET not found"; ls -la dist; exit 1; }
          TAG="v$VERSION"

          if gh release view "$TAG" >/dev/null 2>&1; then
            # Same source, newer Ghidra: add that build to the existing release
            # rather than inventing a new version. Refuse if the release was made
            # from different source (e.g. a plugin_version override that collides),
            # so one release never mixes builds of two commits.
            REL_SHA=$(gh api "repos/$GH_REPO/commits/$TAG" --jq .sha)
            if [ "$REL_SHA" != "$GITHUB_SHA" ]; then
              echo "::error::Release $TAG was built from $REL_SHA, this run is $GITHUB_SHA. Use a different plugin_version."
              exit 1
            fi
            echo "Adding $(basename "$ASSET") to existing release $TAG"
            gh release upload "$TAG" "$ASSET" --clobber
            exit 0
          fi

          NOTES=$(cat <<EOF
          Frida Hook generator for Ghidra, version \`$VERSION\` (date of the source it was built from).

          Built against **Ghidra $GHIDRA_VERSION** - Gradle \`$GRADLE_VERSION\`, JDK \`$JAVA_VERSION\`, commit \`$GITHUB_SHA\`.

          Builds for later Ghidra versions are added to this release as they appear,
          so pick the asset matching your Ghidra install.

          Install: Ghidra -> File -> Install Extensions -> **+** -> select the zip -> restart Ghidra.
          EOF
          )

          gh release create "$TAG" "$ASSET" \
            --target "$GITHUB_SHA" \
            --title "frida_hook_generator $VERSION" \
            --notes "$NOTES"
